[project]
name = "rl-finance"
version = "0.1.0"
description = "Post-train an LLM into a portfolio manager with GRPO"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "yfinance",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
